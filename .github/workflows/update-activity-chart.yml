name: Update Activity Chart

on:
  schedule:
    - cron: "17 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7

      - name: Checkout contribution chart generator
        uses: actions/checkout@v7
        with:
          repository: dturovskiy/deus-commit-chart
          ref: v1
          path: _deus
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install chart generator
        run: npm ci --ignore-scripts --prefix _deus

      # Make the two metadata lines the same white color as the title
      - name: Make chart metadata white
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("_deus/modern-renderer.js")
          text = path.read_text()

          text = text.replace(
              'y="58" fill="${theme.muted}"',
              'y="58" fill="${theme.text}"'
          )

          text = text.replace(
              'y="78" fill="${theme.muted}"',
              'y="78" fill="${theme.text}"'
          )

          path.write_text(text)
          PY

      - name: Generate contribution charts
        env:
          DEUS_COMMIT_CHART_GITHUB_TOKEN: ${{ secrets.DEUS_COMMIT_CHART_TOKEN || github.token }}
        run: |
          set -euo pipefail

          mkdir -p activity-dist

          for DAYS in 30 90 365
          do
            node _deus/generate-commit-chart.js \
              --source github \
              --username arulpanditaa \
              --format svg \
              --days "$DAYS" \
              --theme github-compact \
              --layout spacious \
              --hide-border \
              --title "GitHub Contribution Activity" \
              --out "activity-dist/activity-${DAYS}d.svg"
          done

          touch activity-dist/.nojekyll

      - name: Publish generated charts
        env:
          TARGET_BRANCH: activity-assets
        run: |
          set -euo pipefail

          TEMP_DIR="$(mktemp -d)"
          cp -a activity-dist/. "$TEMP_DIR/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --orphan "$TARGET_BRANCH"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          cp -a "$TEMP_DIR"/. .

          git add -A
          git commit -m "Update GitHub contribution charts"

          git push --force origin "$TARGET_BRANCH"
